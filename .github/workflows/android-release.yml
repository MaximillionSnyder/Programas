name: APK en release

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag del release a construir (ej. v1.9.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Instalar SDK de Android
        run: |
          SDK=/usr/local/lib/android/sdk
          BIN=$(ls -d "$SDK"/cmdline-tools/*/bin | head -1)
          echo "$BIN" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$BIN/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$BIN/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" \
            || "$BIN/sdkmanager" --install "platforms;android-37" "build-tools;36.0.0"

      - name: Compilar APK debug
        run: gradle :app:assembleDebug --console=plain

      - name: Adjuntar el APK al release
        if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "morphdemo-${TAG}-debug.apk"
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" "morphdemo-${TAG}-debug.apk" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: morphdemo-${{ inputs.tag || github.ref_name }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
