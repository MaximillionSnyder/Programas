name: APK en release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag del release a construir (ej. v1.9.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Instalar SDK de Android
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37" "build-tools;36.0.0"

      - name: Quitar el override de aapt2 de Termux
        run: sed -i '/aapt2FromMavenOverride/d' gradle.properties

      - name: Compilar APK debug
        run: gradle :app:assembleDebug --console=plain

      - name: Adjuntar el APK al release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "morphdemo-${TAG}-debug.apk"
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" "morphdemo-${TAG}-debug.apk" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: morphdemo-${{ inputs.tag || github.ref_name }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
